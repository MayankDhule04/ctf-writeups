<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Privilege Escalation</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --line: #dfe6f1;
      --text: #1f2937;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-strong: #1d4ed8;
      --danger: #dc2626;
      --success: #15803d;
      --shadow: 0 12px 34px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f8fafc, var(--bg));
    }

    .container {
      width: min(980px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 0 0 36px;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
    }

    .nav-inner {
      width: min(980px, calc(100vw - 32px));
      margin: 0 auto;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-links a,
    .link-button {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      font-family: inherit;
    }

    .nav-links a:hover,
    .link-button:hover {
      color: var(--accent);
    }

    .nav-user {
      color: var(--text);
      font-size: 0.9rem;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #f8fafc;
    }

    .hero {
      margin-top: 20px;
      padding: 22px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 3.2vw, 2.4rem);
    }

    .lede {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .card.full {
      grid-column: 1 / -1;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1.25rem;
      color: #0f172a;
    }

    .card p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.55;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #ffffff;
      color: var(--text);
      padding: 10px 12px;
      outline: none;
      transition: border-color 160ms ease;
    }

    input:focus {
      border-color: var(--accent);
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button, .button {
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover,
    .button:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    .button.secondary,
    button.secondary {
      color: var(--text);
      background: #ffffff;
      border: 1px solid var(--line);
    }

    .button.secondary:hover,
    button.secondary:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .status {
      min-height: 1.5em;
      margin-top: 12px;
      color: var(--muted);
    }

    .status.error { color: var(--danger); }
    .status.success { color: var(--success); }

    .inline-note {
      margin-top: 8px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .meta-item {
      padding: 10px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid var(--line);
    }

    .meta-item strong {
      display: block;
      font-size: 0.8rem;
      color: #475569;
      margin-bottom: 4px;
    }

    .flag {
      font-size: 1.1rem;
      font-weight: 700;
      background: #fef2f2;
      color: #7f1d1d;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #fecaca;
      word-break: break-all;
    }

    code {
      background: #f1f5f9;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 2px 6px;
    }

    @media (max-width: 900px) {
      .grid,
      .meta-grid {
        grid-template-columns: 1fr;
      }

      .nav-inner {
        height: auto;
        padding: 12px 0;
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a class="brand" href="/">Acme User Portal</a>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/admin">Admin</a>
        <a href="/login">Login</a><a href="/register">Register</a>
      </nav>
    </div>
  </header>
  <main class="container"><section class="hero"><h1>User Dashboard</h1><p class="lede">Please log in or register to update your profile.</p></section><div class="grid"><article class="card full"><h2>Authentication required</h2><p>You are not logged in. Create an account or sign in to continue.</p><div class="actions"><a class="button" href="/login">Login</a><a class="button secondary" href="/register">Register</a></div></article></div></main>
  <script>
    const statusBox = document.querySelector('[data-status]');

    function setStatus(message, kind = '') {
      if (!statusBox) return;
      statusBox.textContent = message;
      statusBox.className = 'status ' + kind;
    }

    async function sendJson(url, payload) {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || 'Request failed');
      }

      return data;
    }

    const registerForm = document.querySelector('[data-register-form]');
    if (registerForm) {
      registerForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        try {
          const result = await sendJson('/api/register', {
            username: form.username.value,
            password: form.password.value,
          });
          setStatus(result.message || 'Account created. Redirecting to login.', 'success');
          setTimeout(() => {
            window.location.href = '/login';
          }, 600);
        } catch (error) {
          setStatus(error.message, 'error');
        }
      });
    }

    const loginForm = document.querySelector('[data-login-form]');
    if (loginForm) {
      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        try {
          await sendJson('/api/login', {
            username: form.username.value,
            password: form.password.value,
          });
          window.location.href = '/';
        } catch (error) {
          setStatus(error.message, 'error');
        }
      });
    }

    const updateForm = document.querySelector('[data-profile-form]');
    if (updateForm) {
      updateForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        try {
          const payload = { display_name: form.display_name.value };
          const result = await sendJson('/api/user', payload);
        //   setStatus('Profile updated. role=' + result.role + ', display_name=' + result.display_name, 'success');
        //   window.location.reload();
        } catch (error) {
          setStatus(error.message, 'error');
        }
      });
    }

    const logoutButton = document.querySelector('[data-logout-button]');
    if (logoutButton) {
      logoutButton.addEventListener('click', async () => {
        try {
          await sendJson('/api/logout', {});
          window.location.href = '/';
        } catch (error) {
          setStatus(error.message, 'error');
        }
      });
    }
  </script>
</body>
</html>
