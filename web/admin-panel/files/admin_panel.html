<!DOCTYPE html>
<html>
 <head>
  <title>
   Internal Portal - Login
  </title>
  <link href="/static/style.min.css" rel="stylesheet"/>
 </head>
 <body>
  <div class="container">
   <div class="form-box">
    <h1>
     Internal Portal
    </h1>
    <h2>
     Login
    </h2>
    <!-- TODO: sanitise user inputs before v2 release -->
    <form action="/login" id="loginForm" method="POST">
     <div class="form-group">
      <label>
       Username
      </label>
      <input name="username" required="" type="text"/>
     </div>
     <div class="form-group">
      <label>
       Password
      </label>
      <input name="password" required="" type="password"/>
     </div>
     <button type="submit">
      Login
     </button>
    </form>
    <p class="link">
     Don't have an account?
     <a href="/register">
      Register here
     </a>
    </p>
   </div>
  </div>
  <script src="/static/app.min.js">
  </script>
 </body>
</html>
